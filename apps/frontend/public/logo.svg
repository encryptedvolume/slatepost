<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" class="slate-mark" role="img" aria-labelledby="slate-mark-title">
  <title id="slate-mark-title">Slate</title>
  <!--
    SLATE — the mark.

    One unbroken channel that advances in equal steps.
    A single constant-thickness ribbon on a 32x32 field:
      thickness  8   (1/4 of the field)
      3 treads   16 long each (1/2 of the field), stepping +8 in x
      2 risers   8 x 4, identical — the equal intervals
    Time runs down and to the right, as it does in a day view.
    The ribbon is cut flush at both edges: the schedule continues past the frame.

    Exact 180-degree rotational symmetry about (16,16).
    Every coordinate is a multiple of 4, so the mark lands on whole
    pixels at 16, 24, 32, 64px and every multiple thereof.
    No gradients, no shadows, no radii — the calendar grid is radius 0.
  -->
  <style>
    .slate-mark { color: #0F0F0F }
    @media (prefers-color-scheme: dark) { .slate-mark { color: #FAFAFA } }
  </style>
  <path fill="currentColor" d="M0,0H16V12H24V24H32V32H16V20H8V8H0Z"/>
</svg>
