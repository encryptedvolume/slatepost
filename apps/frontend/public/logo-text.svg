<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108.35 32" width="108.35" height="32" class="slate-mark" role="img" aria-labelledby="slate-lockup-title">
  <title id="slate-lockup-title">Slate</title>
  <!--
    SLATE — horizontal lockup: mark + wordmark.

    Mark      32 x 32, flush left.
    Clearance 12 between mark and wordmark (optically tightened: the
              mark's top-right quadrant is negative space).
    Wordmark  cap height 24 — exactly 3/4 of the mark height (4:3).
              Cap block (y 4 -> 28) is centred on the mark's axis, y = 16.
              Stroke 2.82. Round letters overshoot 0.36 (cap) / 0.30 (x-height);
              the 'a' bowl does not — it is a stadium and meets the baseline
              flat, so it sits at 28.000 with the 'l' and 't'.

    The wordmark is drawn, not set: every curve is a circular arc and every
    join is tangent-continuous, so the strokes outline exactly. Same
    constructed logic as the mark — one radius, no arbitrary curves.
    Minimum clear space on all sides = 8 (a quarter of the mark height).
  -->
  <style>
    .slate-mark { color: #0F0F0F }
    @media (prefers-color-scheme: dark) { .slate-mark { color: #FAFAFA } }
  </style>
  <g fill="currentColor">
    <!-- mark -->
    <path d="M0,0H16V12H24V24H32V32H16V20H8V8H0Z"/>
    <!-- S -->
    <path d="M54.705,9.135A4.065,4.065 0 1 0 50.885,14.590A6.885,6.885 0 1 1 44.415,23.830L47.065,22.865A4.065,4.065 0 1 0 50.885,17.410A6.885,6.885 0 1 1 57.355,8.170Z"/>
    <!-- l -->
    <path d="M63.470,4.000L63.470,28.000L60.650,28.000L60.650,4.000Z"/>
    <!-- a : arch + stem -->
    <path d="M66.254,16.404A6.570,6.570 0 0 1 72.680,11.200L74.420,11.200A6.570,6.570 0 0 1 80.990,17.770L80.990,28.000L78.170,28.000L78.170,17.770A3.750,3.750 0 0 0 74.420,14.020L72.680,14.020A3.750,3.750 0 0 0 69.012,16.990Z"/>
    <!-- a : bowl
         The bowl is a stadium: its left cap radius is half its height, so
         opening the counter also grows the cap. Counter was 4.47 against the
         'e' ring's 11.76 at an identical 17.1 x-height, which read as a dark
         blob beside a wide-open 'e'. Top edge raised 18.190 -> 16.400.

         The bottom sits on the baseline at 28.000, not on the 28.300 round-
         letter overshoot. Overshoot is an optical correction for a curve
         tangent to the baseline; this bowl meets the baseline with a flat
         edge, exactly like the 'l' and the 't' stem, so it takes none. It
         also has to: the stem to its right ends at 28.000, and at 28.300 the
         bowl left a 1.410 x 0.300 ledge under the union's bottom-right.
           outer height 16.400 -> 28.000 = 11.600 -> cap radius 5.800
           inner radius 5.800 - 2.820 = 2.980 -> counter 5.960
           both caps concentric at y 22.200
         Stroke stays exactly 2.820 on all four sides (16.400->19.220 top,
         25.180->28.000 bottom, 5.800-2.980 at the cap). The cap centre is
         71.910 so the outer left extremum stays at 66.110 and the letter
         keeps its left sidebearing against the arch. -->
    <path d="M79.580,19.220L71.910,19.220A2.980,2.980 0 0 0 71.910,25.180L79.580,25.180L79.580,28.000L71.910,28.000A5.800,5.800 0 0 1 71.910,16.400L79.580,16.400Z"/>
    <!-- t : stem + tail -->
    <path d="M87.560,6.880L87.560,22.990A2.190,2.190 0 0 0 89.750,25.180L89.750,28.000A5.010,5.010 0 0 1 84.740,22.990L84.740,6.880Z"/>
    <!-- t : crossbar
         Left overhang was 84.740 - 83.510 = 1.230, only 0.44x the 2.820
         stroke, so the crossbar read as flush with the stem. Extended to
         82.300 for a 2.440 overhang (0.87x stroke), which reads as a
         deliberate crossbar while keeping 1.310 clear of the 'a' stem at
         80.990. Right overhang is unchanged at 3.750. -->
    <path d="M82.300,11.200L91.310,11.200L91.310,14.020L82.300,14.020Z"/>
    <!-- e : ring -->
    <path d="M105.530,20.170L105.530,17.350A3.630,3.630 0 0 0 101.900,13.720L99.920,13.720A3.630,3.630 0 0 0 96.290,17.350L96.290,21.850A3.630,3.630 0 0 0 99.920,25.480L101.900,25.480A3.630,3.630 0 0 0 103.824,24.928L105.318,27.320A6.450,6.450 0 0 1 101.900,28.300L99.920,28.300A6.450,6.450 0 0 1 93.470,21.850L93.470,17.350A6.450,6.450 0 0 1 99.920,10.900L101.900,10.900A6.450,6.450 0 0 1 108.350,17.350L108.350,20.170Z"/>
    <!-- e : crossbar -->
    <path d="M94.880,17.350L106.940,17.350L106.940,20.170L94.880,20.170Z"/>
  </g>
</svg>
